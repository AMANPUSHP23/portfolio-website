clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log

  - job_name: kubernetes
    static_configs:
      - targets:
          - localhost
        labels:
          job: kubernetes
          __path__: /var/log/pods/*/*/*.log
